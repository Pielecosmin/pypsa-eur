# Adversarial Scenario: Extreme calm period - wind capacity factor at 10%
# Run name: romania-adversarial-03-no_wind

tutorial: true
run:
  name: romania-adversarial-03-no_wind
  disable_progressbar: true
  shared_resources:
    policy: false
scenario:
  clusters:
  - 5
  opts:
  - ''
countries:
- RO
snapshots:
  start: '2020-12-01'
  end: '2020-12-08'
electricity:
  co2limit_enable: true
  co2limit: 100000000.0
  extendable_carriers:
    Generator:
    - solar
    - onwind
    - offwind-ac
    - OCGT
    - CCGT
    - nuclear
    StorageUnit:
    - battery
    Store:
    - H2
    Link:
    - H2 pipeline
  renewable_carriers:
  - solar
  - onwind
  - offwind-ac
  estimate_renewable_capacities:
    enable: true
    from_gem: true
    year: 2020
    expansion_limit: false
    technology_mapping:
      Offshore: offwind-ac
      Onshore: onwind
      PV: solar
atlite:
  default_cutout: europe-2020-sarah3-era5
  cutouts:
    europe-2020-sarah3-era5:
      module:
      - sarah
      - era5
      x:
      - -12.0
      - 42.0
      y:
      - 33.0
      - 72.0
      dx: 0.3
      dy: 0.3
      time:
      - '2020'
      - '2020'
renewable:
  offwind-ac:
    max_depth: false
    capacity_per_sqkm: 0.2
    clip_p_max_pu: 0.1
  offwind-dc:
    max_depth: false
  offwind-float:
    max_depth: false
    min_depth: false
  onwind:
    cutout: default
    capacity_per_sqkm: 0.3
    clip_p_max_pu: 0.1
clustering:
  exclude_carriers:
  - OCGT
  - offwind-ac
  - coal
  temporal:
    resolution_elec: 24h
lines:
  dynamic_line_rating:
    activate: true
    max_line_rating: 1.3
solving:
  solver:
    name: highs
    options: highs-simplex
  check_objective:
    enable: false
_scenario_description: Extreme calm period - wind capacity factor at 10%
