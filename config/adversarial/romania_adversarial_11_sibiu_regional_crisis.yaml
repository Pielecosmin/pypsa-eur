# Adversarial Scenario: Sibiu County Regional Combined Crisis
# Run name: romania-adversarial-11-sibiu_regional_crisis
# Note: PyPSA-Eur models at country/cluster level, not county level.
# This scenario simulates a regional crisis through severe transmission constraints
# combined with nuclear + hydro + gas failures.

tutorial: true
run:
  name: romania-adversarial-11-sibiu_regional_crisis
  disable_progressbar: true
  shared_resources:
    policy: false
scenario:
  clusters:
  - 10  # Higher clustering for more regional granularity
  opts:
  - ''
countries:
- RO
snapshots:
  start: '2020-12-01'
  end: '2020-12-08'
electricity:
  co2limit_enable: true
  co2limit: 100000000.0
  extendable_carriers:
    Generator:
    - solar
    - onwind
    - offwind-ac
    # No nuclear, no OCGT, no CCGT (combined crisis)
    StorageUnit:
    - battery
    Store:
    - H2
    Link:
    - H2 pipeline
  renewable_carriers:
  - solar
  - onwind
  - offwind-ac
  estimate_renewable_capacities:
    enable: true
    from_gem: true
    year: 2020
    expansion_limit: false
    technology_mapping:
      Offshore: offwind-ac
      Onshore: onwind
      PV: solar
  # Filter out nuclear plants
  powerplants_filter: (DateOut >= 2024 or DateOut != DateOut) and Fueltype != 'Nuclear'
  # No gas allowed (gas crisis)
  gaslimit_enable: true
  gaslimit: 0
  # Regional isolation - no imports from neighbors
  autarky:
    enable: true
    by_country: true
atlite:
  default_cutout: europe-2020-sarah3-era5
  cutouts:
    europe-2020-sarah3-era5:
      module:
      - sarah
      - era5
      x:
      - -12.0
      - 42.0
      y:
      - 33.0
      - 72.0
      dx: 0.3
      dy: 0.3
      time:
      - '2020'
      - '2020'
renewable:
  offwind-ac:
    max_depth: false
  offwind-dc:
    max_depth: false
  offwind-float:
    max_depth: false
    min_depth: false
  # Hydro drought - 20% capacity
  hydro:
    carriers:
    - ror
    - PHS
    - hydro
    PHS_max_hours: 6
    hydro_max_hours: 1.0
    clip_min_inflow: 0.2
clustering:
  exclude_carriers:
  - OCGT
  - offwind-ac
  - coal
  temporal:
    resolution_elec: 24h
lines:
  # Severe transmission constraints - simulating regional grid damage
  s_max_pu: 0.3  # Only 30% of line capacity (worse than scenario 7)
  s_nom_max: 50000 # Finite limit to avoid solver error
  max_extension: 0  # No grid expansion possible
  dynamic_line_rating:
    activate: false
    max_line_rating: 1.0  # No dynamic rating boost
solving:
  solver:
    name: highs
    options: highs-simplex
  options:
    transmission_losses: 0
  check_objective:
    enable: false

# Load scaling to simulate localized demand surge (like winter heating in mountain region)
load:
  scaling_factor: 1.2  # 20% higher demand

_scenario_description: Sibiu County Regional Combined Crisis - Nuclear+Hydro+Gas down, severe grid constraints, import isolation, simulating regional emergency in central Romania
