# Romania Winter 2019 Baseline (no stress shocks)

tutorial: true
run:
  name: romania-2019-winter-baseline
  disable_progressbar: true
  shared_resources:
    policy: false

scenario:
  clusters:
  - 10
  opts:
  - ''

countries:
- RO
- BG
- HU
- RS

snapshots:
  start: '2019-01-13 22:00'
  end: '2019-01-20 22:00'
  inclusive: left

electricity:
  co2limit_enable: true
  co2limit: 100000000.0
  extendable_carriers:
    Generator: []
    StorageUnit: []
    Store: []
    Link: []
  renewable_carriers:
  - solar
  - onwind
  - offwind-ac
  - hydro
  estimate_renewable_capacities:
    enable: true
    from_gem: true
    year: 2019
    expansion_limit: false
    technology_mapping:
      Offshore: offwind-ac
      Onshore: onwind
      PV: solar

atlite:
  default_cutout: europe-2019-era5
  cutouts:
    europe-2019-era5:
      module: era5
      x:
      - -12.0
      - 35.0
      y:
      - 33.0
      - 72.0
      dx: 0.3
      dy: 0.3
      time:
      - '2019'
      - '2019'

renewable:
  hydro:
    carriers:
    - ror
    - PHS
    - hydro
    PHS_max_hours: 6
    hydro_max_hours: energy_capacity_totals_by_country
    flatten_dispatch: true
    flatten_dispatch_buffer: 0.2
    clip_min_inflow: 1.0
  offwind-ac:
    max_depth: false
  offwind-dc:
    max_depth: false
  offwind-float:
    max_depth: false
    min_depth: false

clustering:
  exclude_carriers:
  - OCGT
  - offwind-ac
  - coal
  temporal:
    resolution_elec: false

lines:
  max_extension: 500
  dynamic_line_rating:
    activate: false
    max_line_rating: 1.0

links:
  max_extension: 500

solving:
  solver:
    name: highs
    options: highs-simplex
  options:
    load_shedding: 100000
  check_objective:
    enable: false
